name: 自动部署到 CF Worker

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'wrangler.toml'
  workflow_dispatch:

jobs:
  auto-deploy:
    runs-on: ubuntu-latest
    env:
      PASSWORD: ${{ secrets.PASSWORD }}
      TGID: ${{ secrets.TGID}}
      TGTOKEN: ${{ secrets.TGTOKEN}}
      CF_KV_ID: ${{ secrets.CF_KV_ID }}
      CF_CRONS: ${{ vars.CF_CRONS || '0 1,13 * * *' }}

    steps:
      - name: ⬇️ 检出仓库
        uses: actions/checkout@v4

      - name: 🛠️ 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🆙 更新并安装最新 Wrangler
        run: npm install -g wrangler@latest

      - name: 🔄 处理 wrangler.toml（注入已有 KV / 自定义 Cron，均可选）
        id: config_setup
        run: |
          # 设置了 CF_KV_ID 时注入 id 绑定已有 KV；未设置则部署时自动创建新 KV
          if [ -n "${CF_KV_ID}" ]; then
            sed -i "/binding = \"DOMAIN_KV\"/a id = \"${CF_KV_ID}\"" wrangler.toml
            echo "✅ 已注入现有 KV id，将绑定到已有命名空间"
          else
            echo "ℹ️ 未设置 CF_KV_ID，部署时将自动创建 KV 命名空间"
          fi
          # CF_CRONS 有默认值，始终覆盖默认触发时间（未自定义时写回同值）
          sed -i "s#^crons = .*#crons = [\"${CF_CRONS}\"]#" wrangler.toml

          WORKER_NAME=$(grep '^name =' wrangler.toml | awk -F '"' '{print $2}')
          [ -n "$WORKER_NAME" ] || { echo "🔴 错误: 未能在 wrangler.toml 中找到 'name' 字段"; exit 1; }

          echo -e "\n🎉 项目配置信息如下:"
          echo "-------------------"
          cat wrangler.toml
          echo "-------------------"
          echo "worker_name=$WORKER_NAME" >> $GITHUB_OUTPUT

      - name: ⚙️ 动态配置 Worker 环境变量
        id: dynamic_vars
        run: |
          VARS=""
          [ -n "$PASSWORD" ] && VARS+="PASSWORD"$'\n' || echo "⚠️ 警告: PASSWORD 变量未设置，默认为 123123"
          [ -n "$TGID" ] && [ -n "$TGTOKEN" ] && VARS+="TGID"$'\n'"TGTOKEN"$'\n' || echo "⚠️ 警告: TG 变量未设置，无法执行 TG 通知"
          printf 'vars_list<<EOF\n%sEOF\n' "$VARS" >>"$GITHUB_OUTPUT"

          if [ -n "$VARS" ]; then
            printf 'vars_list<<EOF\n%sEOF\n' "$VARS" >>"$GITHUB_OUTPUT"
            echo -e "\n✅ 传递给 Wrangler 的环境变量名:"
            printf '%s' "$VARS"
          else
            echo -e "\n⚠️ 没有需要传递的变量名"
            printf 'vars_list=\n' >>"$GITHUB_OUTPUT"
          fi

      - name: 🚀 部署到 CF Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ vars.CF_ACCOUNT_ID }}
          vars: ${{ steps.dynamic_vars.outputs.vars_list }}

      - name: ✨ 输出 Worker 管理后台
        env:
          WORKER_NAME: ${{ steps.config_setup.outputs.worker_name }}
          ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          echo -e "\n✨✨✨ 部署完成 ✨✨✨"
          echo "🌐 点击以下链接可访问项目管理后台"
          echo "https://dash.cloudflare.com/${ACCOUNT_ID}/workers/services/view/${WORKER_NAME}/production/settings"
          echo "🚀 建议: 给项目绑定一个自定义域名"
